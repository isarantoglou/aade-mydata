name: PHP Composer

on:
  push:
    branches: [ "4.x", "5.x", "6.x" ]
  pull_request:
    branches: [ "4.x", "5.x", "6.x" ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        guzzle: [ "7", "8" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      # Resolve for this PHP version (PHPUnit 12 on 8.3, PHPUnit 13 on 8.4+)
      # instead of installing the lock file, and pin the Guzzle major under test.
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}"

      - name: Run test suite
        run: composer test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, libxml, mbstring
          coverage: none

      # The lock file pins Guzzle 8, which the analysis is written against.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer analyse
